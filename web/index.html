<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="CytoWeave: open-source flow cytometry analysis" />
    <title>CytoWeave</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=0.8.1" />
  </head>
  <body>
    <div id="app" class="app" data-mode="gate">
      <header class="topbar">
        <div class="brand" title="CytoWeave">
          <img src="favicon.svg" alt="" width="26" height="26" />
          <span class="brand-name">Cyto<b>Weave</b></span>
        </div>
        <button id="workspace-menu" class="workspace-title" type="button" title="Workspace menu">
          <span id="workspace-name">Untitled workspace</span>
          <span id="save-state" class="save-state" title="Saved" role="img" aria-label="Saved"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
        </button>
        <nav id="mode-switcher" class="mode-switcher" role="tablist" aria-label="Views"></nav>
        <div class="topbar-actions">
          <button id="command-button" class="command-button" type="button" title="Search samples, populations, channels and commands (⌘K)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
            <span>Search or run a command</span>
            <kbd>⌘K</kbd>
          </button>
          <button id="undo-button" class="icon-button" type="button" title="Undo (⌘Z)" aria-label="Undo"></button>
          <button id="redo-button" class="icon-button" type="button" title="Redo (⇧⌘Z)" aria-label="Redo"></button>
          <button id="theme-button" class="icon-button" type="button" title="Appearance: theme and color-vision-friendly colors" aria-label="Appearance" aria-haspopup="menu"></button>
          <button id="help-button" class="icon-button" type="button" title="Help and keyboard shortcuts (?)" aria-label="Help"></button>
        </div>
      </header>

      <aside id="sidebar" class="sidebar" aria-label="Samples and populations">
        <section id="samples-panel" class="panel samples-panel"></section>
        <div class="splitter" id="sidebar-splitter" role="separator" aria-orientation="horizontal"></div>
        <section id="populations-panel" class="panel populations-panel"></section>
      </aside>

      <main id="workbench" class="workbench" aria-live="polite"></main>

      <aside id="inspector" class="inspector" aria-label="Inspector"></aside>

      <footer id="statusbar" class="statusbar"></footer>

      <div id="drop-overlay" class="drop-overlay" hidden>
        <div class="drop-card">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 19h14" /></svg>
          <strong>Drop FCS files, folders or workspaces</strong>
          <span>Files are read on this computer and never uploaded.</span>
        </div>
      </div>
    </div>
    <div id="overlay-root"></div>
    <input id="file-input" type="file" multiple hidden accept=".fcs,.lmd,.cwz,.json,.wsp,.wspt,.xml,.csv,.acs,.zip" />
    <input id="folder-input" type="file" webkitdirectory multiple hidden />
    <script type="module" src="app.js?v=0.8.1"></script>
  </body>
</html>
