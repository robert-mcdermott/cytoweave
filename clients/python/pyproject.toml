[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cytoweave"
version = "0.8.1"
description = "Remote control of a running CytoWeave (flow, spectral and mass cytometry analysis) from Python"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Robert McDermott" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["flow cytometry", "spectral cytometry", "mass cytometry", "CytoWeave"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
pandas = ["pandas"]

[project.urls]
Homepage = "https://github.com/robert-mcdermott/cytoweave"
Documentation = "https://github.com/robert-mcdermott/cytoweave/tree/main/clients"

[tool.setuptools.packages.find]
where = ["src"]
